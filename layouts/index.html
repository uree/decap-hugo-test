<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }}</title>
</head>
<body>

  <header>
    <h1>{{ .Site.Title }}</h1>
  </header>

  <main>
    <h2>Posts</h2>

    <ul>
      {{ range where .Site.RegularPages "Section" "posts" }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          <small>{{ .Date.Format "2006-01-02" }}</small>
        </li>
      {{ else }}
        <li>No posts yet.</li>
      {{ end }}
    </ul>
  </main>

</body>
</html>
