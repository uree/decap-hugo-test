<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <title>{{ .Title }} — {{ .Site.Title }}</title>
</head>
<body>

  <header>
    <a href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
  </header>

  <main>
    <article>
      <h1>{{ .Title }}</h1>

      {{ with .Resources.Get .Params.featured_image }}
        {{ partial "posts/image.html" . }}
      {{ end }}

      <p>
        <time datetime="{{ .Date.Format "2006-01-02" }}">
          {{ .Date.Format "January 2, 2006" }}
        </time>
      </p>

      {{ with .Params.description }}
        <p>{{ . }}</p>
      {{ end }}

      <div>
        {{ .Content }}
      </div>
      <div>
        {{ with .Params.manual_pdf }}
          {{ range . }}
            <iframe src="{{ . | relURL }}" width="100%" height="800"></iframe>
          {{ end }}
        {{ end }}
      </div>
    </article>
  </main>

</body>
</html>
