backend:
  name: git-gateway
  branch: main

media_folder: static/images
public_folder: /images

collections:
  - name: posts
    label: Posts
    folder: content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""

    fields:
      - label: Title
        name: title
        widget: string

      - label: Publish Date
        name: date
        widget: datetime

      - label: Description
        name: description
        widget: string
        required: false
      
      - label: Featured Image
        name: featured_image
        widget: image
        required: false
        media_folder: ""
        public_folder: ""
      
      - label: "Manual PDF"
        name: "manual_pdf"
        widget: "file"
        default: "/uploads/general-manual.pdf"
        media_library:
          config:
            multiple: true

      - label: Body
        name: body
        widget: markdown
        media_folder: ""
        public_folder: ""